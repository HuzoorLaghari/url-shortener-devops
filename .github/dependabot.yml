version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      # One catch-all group: every update type, prod and dev, lands in a single PR
      # per cycle. The previous split (dev minor+patch / prod patch) left production
      # minors and all majors ungrouped, and each of those became its own PR --
      # that was the actual source of the PR flood, not the weekly cadence.
      all-dependencies:
        patterns: ["*"]
    ignore:
      # Pinned until the Phase 1b lint-stack migration lands.
      # eslint 10 against eslint-config-airbnb-base 15 (peer caps at eslint 8)
      # is what makes `npm install` fail on a fresh clone today. Letting
      # Dependabot raise these majors again would re-break the repo.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-airbnb-base"
        update-types: ["version-update:semver-major"]

# NOTE: no "github-actions" ecosystem block here on purpose. Dependabot errors on every
# run if that ecosystem is declared while the repo has no .github/workflows/ directory.
